name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: iqbalairlangga
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?color_snake=00E5FF&color_dots=7C3AED,5b21b6,312E81,020617,FF2D75

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
